```html
<!DOCTYPE html>
<html>
<head>
  <title>Secret Access 🎯</title>
  <style>
    body {
      margin:0;
      text-align:center;
      font-family: Arial;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      color:white;
      overflow:hidden;
    }

    .box { margin-top:100px; }

    button {
      padding:12px 20px;
      margin:10px;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    #noBtn { position:absolute; }

    h1 { font-size:40px; }
  </style>
</head>

<body>

<div id="level1" class="box">
  <h2>🔐 Generating Secret Code...</h2>
  <h1 id="genCode"></h1>
  <input id="userCode" placeholder="Enter code">
  <br>
  <button onclick="check()">Enter</button>
</div>

<div id="level2" class="box" style="display:none;">
  <h2 id="funText"></h2>
  <button onclick="next()">YES 😎</button>
  <button id="noBtn" onmouseover="move()">NO 😜</button>
</div>

<div id="final" class="box" style="display:none;">
  <h1>🎉 SURPRISE 🎉</h1>
  <h2 id="finalText"></h2>
</div>

<script>

/* Random Code */
let code = Math.floor(1000 + Math.random()*9000);
document.getElementById("genCode").innerText = code;

/* Funny texts */
let texts = [
  "Are you smart? 😏",
  "Do you deserve cake? 🎂",
  "Are you the main character? 😎",
  "Are you broke or rich? 😂"
];

let finalTexts = [
  "Happy Birthday Legend 🎂",
  "You survived the test 😎",
  "You are officially old now 😂",
  "Cake incoming 🎉"
];

/* Check */
function check(){
  let val = document.getElementById("userCode").value;
  if(val == code){
    document.getElementById("level1").style.display="none";
    document.getElementById("level2").style.display="block";
    randomText();
  } else alert("Wrong code 😜");
}

/* Random question */
function randomText(){
  let t = texts[Math.floor(Math.random()*texts.length)];
  document.getElementById("funText").innerText = t;
}

function next(){
  document.getElementById("level2").style.display="none";
  document.getElementById("final").style.display="block";
  let t = finalTexts[Math.floor(Math.random()*finalTexts.length)];
  document.getElementById("finalText").innerText = t;
}

/* Moving NO button */
function move(){
  let btn = document.getElementById("noBtn");
  btn.style.top = Math.random()*80+"%";
  btn.style.left = Math.random()*80+"%";
}

</script>

</body>
</html>
```
