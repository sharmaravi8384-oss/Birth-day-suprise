```html
<!DOCTYPE html>
<html>
<head>
  <title>Secret Mission 🎯</title>
  <style>
    body {
      margin:0;
      font-family: Arial;
      text-align:center;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      color:white;
    }

    .box { margin-top:100px; }

    button {
      padding:12px 20px;
      margin:10px;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }

    #noBtn {
      position:absolute;
    }

    img {
      width:200px;
      border-radius:15px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<!-- LEVEL 1 -->
<div id="level1" class="box">
  <h2>🔐 Enter Secret Code</h2>
  <input id="code">
  <br>
  <button onclick="checkCode()">Enter</button>
</div>

<!-- LEVEL 2 -->
<div id="level2" class="box" style="display:none;">
  <h2>😏 Are you awesome?</h2>
  <button onclick="nextLevel()">YES 😎</button>
  <button id="noBtn" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- LEVEL 3 -->
<div id="level3" class="box" style="display:none;">
  <h2>🎯 One more question</h2>
  <p>Do you deserve a surprise?</p>
  <button onclick="nextLevel2()">YES 🎉</button>
  <button id="noBtn2" onmouseover="moveNo2()">NO 😈</button>
</div>

<!-- FINAL -->
<div id="final" class="box" style="display:none;">
  <h1>🎂 HAPPY BIRTHDAY 🎉</h1>
  <p>Gotcha 😜</p>
  <p>This was your surprise!</p>

  <img src="https://via.placeholder.com/200">
</div>

<script>

/* Password */
function checkCode(){
  let code=document.getElementById("code").value.toLowerCase();
  if(code==="123"){  // simple universal code
    show("level1","level2");
  } else alert("Wrong code 😜");
}

function nextLevel(){
  show("level2","level3");
}

function nextLevel2(){
  show("level3","final");
}

/* Show function */
function show(hide,show){
  document.getElementById(hide).style.display="none";
  document.getElementById(show).style.display="block";
}

/* Moving NO button */
function moveNo(){
  let btn=document.getElementById("noBtn");
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

function moveNo2(){
  let btn=document.getElementById("noBtn2");
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

</script>

</body>
</html>
```
