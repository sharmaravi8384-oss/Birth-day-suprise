<!DOCTYPE html>
<html>
<head>
  <title>Birthday Mission 🎂</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      overflow: hidden;
    }

    .box { margin-top: 100px; }

    input, button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin: 10px;
      font-size: 16px;
    }

    button { background: white; cursor: pointer; }

    img {
      width: 200px;
      border-radius: 15px;
      margin-top: 20px;
    }

    #hacker {
      position: fixed;
      width: 100%;
      height: 100%;
      background: black;
      color: lime;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- HACKER INTRO -->
<div id="hacker">Initializing Surprise...</div>

<!-- LEVEL 1 -->
<div id="level1" class="box" style="display:none;">
  <h2>🔐 Enter Secret Code</h2>
  <input id="code">
  <br>
  <button onclick="checkCode()">Unlock</button>
</div>

<!-- LEVEL 2 -->
<div id="level2" class="box" style="display:none;">
  <h2>😂 Who is the legend?</h2>
  <button onclick="nextLevel()">ME 😎</button>
</div>

<!-- LEVEL 3 -->
<div id="level3" class="box" style="display:none;">
  <h2>🧠 Memory Check</h2>
  <p>Where did we first meet?</p>
  <input id="answer">
  <br>
  <button onclick="checkAnswer()">Submit</button>
</div>

<!-- FINAL -->
<div id="final" class="box" style="display:none;">
  <h1 id="typing"></h1>

  <img src="https://via.placeholder.com/200">

  <p>You’re not just a friend… you’re family ❤️</p>
</div>

<audio autoplay loop>
  <source src="https://www.fesliyanstudios.com/play-mp3/387">
</audio>

<script>

/* Hacker intro */
setTimeout(()=>{
  document.getElementById("hacker").style.display="none";
  document.getElementById("level1").style.display="block";
},2000);

function checkCode() {
  let code = document.getElementById("code").value.toLowerCase();
  if (code === "buddy") { // CHANGE
    show("level1","level2");
  } else alert("Wrong 😜");
}

function nextLevel() {
  show("level2","level3");
}

function checkAnswer() {
  let ans = document.getElementById("answer").value.toLowerCase();
  if(ans === "school"){ // CHANGE
    show("level3","final");
    startTyping();
    startConfetti();
  } else alert("Think again 😏");
}

function show(hide, show) {
  document.getElementById(hide).style.display="none";
  document.getElementById(show).style.display="block";
}

/* Typing */
let text = "🎂 HAPPY BIRTHDAY LEGEND 🎉";
let i = 0;
function startTyping() {
  let inter = setInterval(()=>{
    document.getElementById("typing").innerHTML += text[i];
    i++;
    if(i>=text.length) clearInterval(inter);
  },80);
}

/* Confetti */
function startConfetti() {
  let c = document.getElementById("confetti");
  let ctx = c.getContext("2d");
  c.width = window.innerWidth;
  c.height = window.innerHeight;

  let pieces = [];
  for(let i=0;i<80;i++){
    pieces.push({
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      size: 5,
      speed: Math.random()*3+1
    });
  }

  function update(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      ctx.fillRect(p.x,p.y,p.size,p.size);
      p.y += p.speed;
      if(p.y>c.height) p.y=0;
    });
    requestAnimationFrame(update);
  }
  update();
}
</script>

</body>
</html>
